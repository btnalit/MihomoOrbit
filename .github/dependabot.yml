version: 2

# 硬分叉后不跟上游代码,但依赖 CVE 必须自行跟进(见设计规范 §7)。
#
# 三条噪音控制,均为 2026-08-05 首次启用后按实际效果收紧:
#   1. 每个生态**合并成一个 PR**(patterns: ["*"]),而不是每个依赖一个 PR。
#   2. **忽略 major 升级**——checkout 4→7、typescript 6→7、better-sqlite3 12→13
#      这类破坏性升级需要人工决策,不该自动开 PR 并占满 CI。需要时手动升。
#   3. PR 上限压到 1,避免同时挂十几个分支。
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    # 这里**不**忽略 major:官方 action 的大版本升级是例行维护,而且是必需的——
    # 2026-08-05 的构建日志显示 checkout@v4 / build-push-action@v6 等已被钉在
    # 废弃的 Node 20 运行时上。危险的是 npm/gomod 的 major(typescript 6->7、
    # better-sqlite3 12->13 会真的编译不过),那两个生态仍然忽略。
    # 分组保证它们仍然只开一个 PR。
