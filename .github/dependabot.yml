version: 2
updates:
  # 硬分叉后不跟上游代码,但依赖 CVE 必须自行跟进(见设计规范 §7)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
