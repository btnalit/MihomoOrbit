name: Agent Build

on:
  pull_request:
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-build.yml"
      - ".github/workflows/agent-release.yml"
  push:
    branches:
      - main
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-build.yml"

concurrency:
  # 同一分支上被取代的运行直接取消。tag 不走这个 workflow,
  # 所以这里可以无条件取消而不会打断发布。
  group: agent-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          # agent 零外部依赖(go.mod 无 require,仓库里也没有 go.sum),
          # 开着缓存只会每次刷一条 "Restore cache failed" 的误导性警告。
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Vulnerability scan
        # govulncheck@latest 需要 Go >= 1.25,而 go.mod 声明 go 1.22 且
        # setup-go 会把 GOTOOLCHAIN 钉成 local——必须允许自动拉取工具链,
        # 否则这一步必然失败(不是依赖问题,是工具链约束)。
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: armv7
            goarch: arm
            goarm: "7"
          - os: linux
            arch: mips
            gomips: softfloat
          - os: linux
            arch: mipsle
            gomips: softfloat
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          # agent 零外部依赖(go.mod 无 require,仓库里也没有 go.sum),
          # 开着缓存只会每次刷一条 "Restore cache failed" 的误导性警告。
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch || matrix.arch }}
          GOARM: ${{ matrix.goarm || '' }}
          GOMIPS: ${{ matrix.gomips || '' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/orbit-agent-${{ matrix.os }}-${{ matrix.arch }}" .
