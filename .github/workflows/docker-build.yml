name: Build and Push Docker Image

on:
  push:
    branches: [main, dev, "preview/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
    # PR 阶段这个 workflow 唯一的独有价值是"镜像还能不能构建出来"。
    # 应用代码的正确性由 ci.yml 覆盖,所以只在真正可能弄坏镜像的文件
    # 变动时才花这份构建时间——dependabot 的十个 PR 各烧掉一次多架构
    # 构建,就是没有这个过滤器的直接后果。
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  # 除 tag 外一律取消被取代的运行。分支上新提交的镜像本来就会覆盖同名
  # 标签(latest / 版本号 / sha),让旧的多架构构建跑满 18 分钟毫无意义。
  # tag 推送("refs/tags/v*")必须跑完:中途取消会在 GHCR 上留下不完整的
  # 多架构 manifest,而那是对外发布的产物。
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # 必须写死小写:GHCR 拒绝大写镜像名,而 ${{ github.repository }} 会给出 btnalit/MihomoOrbit
  GHCR_IMAGE: ghcr.io/btnalit/mihomo-orbit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Derive preview tag for preview/* branches
        id: preview
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == preview/* ]]; then
            raw="${GITHUB_REF_NAME#preview/}"
            safe="$(echo "${raw}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "tag=dev-${safe}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ steps.preview.outputs.tag }},enable=${{ steps.preview.outputs.enabled == 'true' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            type=sha,prefix=,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=${{ steps.pkg.outputs.version }}-dev,enable=${{ github.ref_name == 'dev' }}
            type=sha,prefix=dev-,enable=${{ github.ref_name == 'dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # PR 只验证 amd64 能否构建即可:多架构走 QEMU 模拟 arm64,单次约 18 分钟,
          # 而 PR 阶段并不推送镜像。完整矩阵留给 main/tag 的真实发布。
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
